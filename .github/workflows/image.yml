name: image

# Builds, scans, signs and publishes multi-arch container images.
# Supports 3 independent services: panel, dns, proxy.
# On 'dev' branch: builds :dev and :dev-<sha> for all services.
# On release tags or workflow_call: builds :latest and :<version> for the specified service.
on:
  push:
    branches: [main, dev]
    tags: ["panel-v*", "dns-v*", "proxy-v*", "v*"]
  workflow_call:
    inputs:
      service:
        description: "Service name (panel, dns, proxy, or all)"
        required: false
        type: string
        default: "all"
      tag_name:
        description: "Release tag name (e.g. panel-v0.2.0)"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      service:
        description: "Service name (panel, dns, proxy, or all)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - panel
          - dns
          - proxy
      tag_name:
        description: "Tag name or version"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: image-${{ inputs.service || 'all' }}-${{ inputs.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ inputs.service == 'panel' && fromJSON('["panel"]') ||
                     inputs.service == 'dns' && fromJSON('["dns"]') ||
                     inputs.service == 'proxy' && fromJSON('["proxy"]') ||
                     startsWith(github.ref, 'refs/tags/panel-v') && fromJSON('["panel"]') ||
                     startsWith(github.ref, 'refs/tags/dns-v') && fromJSON('["dns"]') ||
                     startsWith(github.ref, 'refs/tags/proxy-v') && fromJSON('["proxy"]') ||
                     fromJSON('["panel", "dns", "proxy"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag_name || github.ref }}

      - name: determine image and version
        id: info
        run: |
          RAW_REF="${{ inputs.tag_name || github.ref_name }}"
          SERVICE="${{ matrix.service }}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/dnsmarty-${SERVICE}"
          echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

          if [[ "$RAW_REF" =~ -v([0-9]+\.[0-9]+\.[0-9]+.*) ]]; then
            VER="${BASH_REMATCH[1]}"
            IS_REL="true"
          elif [[ "$RAW_REF" =~ ^v([0-9]+\.[0-9]+\.[0-9]+.*) ]]; then
            VER="${BASH_REMATCH[1]}"
            IS_REL="true"
          elif [[ "${{ github.ref }}" == refs/heads/dev ]]; then
            VER="dev"
            IS_REL="false"
          else
            VER="latest"
            IS_REL="false"
          fi
          echo "SERVICE_VERSION=${VER}" >> "$GITHUB_ENV"
          echo "IS_RELEASE=${IS_REL}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=dev-,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=latest,enable=${{ env.IS_RELEASE == 'true' || github.ref == 'refs/heads/main' }}
            type=raw,value=${{ env.SERVICE_VERSION }},enable=${{ env.IS_RELEASE == 'true' }}
            type=sha,prefix=,enable=${{ env.IS_RELEASE == 'true' || github.ref == 'refs/heads/main' }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.service }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.SERVICE_VERSION }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag_name != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag_name || github.ref }}

      - name: assets
        run: |
          mkdir dist
          cp scripts/dnsmarty.sh scripts/dnsmarty-node.sh scripts/install-node.sh dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          append_body: true
